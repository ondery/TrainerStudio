services:
  trainer-studio:
    build: .
    image: ghcr.io/ondery/trainerstudio:1.0.0
    ports:
      - "43150:43150"
    environment:
      STUDIO_HOST: 0.0.0.0
      STUDIO_PORT: "43150"
      STUDIO_DATASET: /data
      STUDIO_DATA: /var/lib/trainer-studio
    volumes:
      - ${DATASET:-./data/dataset}:/data
      - studio-data:/var/lib/trainer-studio

volumes:
  studio-data:
