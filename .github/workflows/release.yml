name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m ruff check trainer_studio ee tests scripts
          python -m pytest -q
          python scripts/check_public_tree.py
      - name: Static UI
        working-directory: web
        run: |
          npm ci
          npm run i18n
          npm run build
          rm -rf ../static
          mkdir -p ../static
          cp -a out/. ../static/
      - name: Windows archive
        run: python scripts/package_zip.py trainer-studio-release.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            trainer-studio-release.zip
            SHA256SUMS
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  windows:
    runs-on: windows-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Static UI
        working-directory: web
        shell: bash
        run: |
          npm ci
          npm run build
          rm -rf ../static
          mkdir -p ../static
          cp -a out/. ../static/
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"
      - name: MSI and NSIS
        working-directory: src-tauri
        run: cargo tauri build --bundles msi,nsis
      - name: Checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          root = pathlib.Path("src-tauri/target/release/bundle")
          lines = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.suffix.lower() in {".msi", ".exe"}:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  lines.append(f"{digest}  {path.as_posix()}")
          pathlib.Path("windows-SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
            windows-SHA256SUMS
