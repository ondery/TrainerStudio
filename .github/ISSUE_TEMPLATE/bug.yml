name: Bug
description: A defect in labeling, import, export, or the local server
labels: []
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did and what you expected. Do not paste datasets, license keys, or session tokens.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps
      description: Smallest way to see the bug again.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: The version and build id from /api/health or Settings.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
